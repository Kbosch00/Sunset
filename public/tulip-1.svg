<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none">
  <defs>
    <linearGradient id="tulipPetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9a8d4" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#fb7185" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="tulipStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="tulipLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#4ade80" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Tallo -->
  <path d="M100 120 C100 160, 96 210, 100 270" stroke="url(#tulipStem)" stroke-width="4" stroke-linecap="round"/>

  <!-- Hoja izquierda -->
  <path d="M98 180 C70 170, 40 190, 55 220 C70 200, 90 195, 98 200" fill="url(#tulipLeaf)"/>

  <!-- Hoja derecha -->
  <path d="M100 200 C130 185, 155 200, 145 230 C130 210, 110 205, 100 210" fill="url(#tulipLeaf)"/>

  <!-- Pétalo izquierdo -->
  <path d="M100 115 C70 90, 55 50, 75 30 C90 45, 95 70, 100 95" fill="url(#tulipPetal)"/>

  <!-- Pétalo derecho -->
  <path d="M100 115 C130 90, 145 50, 125 30 C110 45, 105 70, 100 95" fill="url(#tulipPetal)"/>

  <!-- Pétalo central -->
  <path d="M100 120 C85 85, 80 45, 100 25 C120 45, 115 85, 100 120" fill="url(#tulipPetal)" opacity="0.9"/>
</svg>